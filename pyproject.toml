[build-system]
requires = ["hatchling>=1.22.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "college_board_scraper"
version = "0.5.0"
authors = [
  { name="Vishwesswaran Gopal", email="vishy1290@gmail.com" },
]
description = "A package to download SAT Suite Question Bank content and assets from College Board."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Topic :: Internet :: WWW/HTTP",
    "Intended Audience :: Developers",
]
dependencies = [
    "beautifulsoup4>=4.12.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
]
license = {file = "LICENSE"}
keywords = ["scraper", "collegeboard", "sat", "question-bank"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
college-board-scraper = "college_board_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/VG-Fish/College-Board/"
